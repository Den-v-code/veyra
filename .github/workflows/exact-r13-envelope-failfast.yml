name: exact-r13-envelope-failfast

on:
  push:
    branches:
      - verify/r13-envelope-failfast-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 464f891a91436cb91fe5bacfd49ef3bee933cbf9
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Den-v-code/veyra
          ref: 464f891a91436cb91fe5bacfd49ef3bee933cbf9
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"
      - name: Install exact Python tools
        run: |
          python -m pip install --no-deps --requirement requirements/ci-py311.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Ruff focused
        run: |
          python -m ruff check             src/core/intrinsic_observer_echo_formal_bridge.py             tests/test_intrinsic_observer_echo_envelope_failfast.py
      - name: Targeted fail-fast regression
        run: |
          python -m pytest -q -p no:cacheprovider             tests/test_intrinsic_observer_echo_envelope_failfast.py
      - name: Attest exact target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
