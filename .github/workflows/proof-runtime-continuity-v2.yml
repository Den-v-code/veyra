name: proof-runtime-continuity-v1

on:
  push:
    branches:
      - verify/current-tree-proof-runtime-continuity-v2

permissions:
  contents: read

jobs:
  focused:
    name: R7/R9 runtime continuity boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: 5ba506aef82f5df934e3de9d6be8b9d7d56ad5d7
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Den-v-code/veyra
          ref: 5ba506aef82f5df934e3de9d6be8b9d7d56ad5d7
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"

      - name: Install focused tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3 ruff==0.15.6

      - name: Static and isolated hostile regressions
        run: |
          set -euo pipefail
          ruff check             src/core/proof_core_manifest.py             src/core/intrinsic_mode_manifest.py             src/core/proof_elaboration_toolchain.py             src/core/proof_core_bridge.py             src/core/intrinsic_mode_bridge.py             tests/test_proof_core_bridge.py             tests/test_intrinsic_mode_bridge.py
          pytest -q -p no:cacheprovider             tests/test_proof_core_bridge.py::test_missing_direct_lean_is_not_accepted             tests/test_proof_core_bridge.py::test_lean_command_uses_fixed_content_pinned_binary             tests/test_proof_core_bridge.py::test_lean_command_rejects_unreviewed_compiler_content             tests/test_proof_core_bridge.py::test_toolchain_identity_is_content_bound_not_filesystem_metadata             tests/test_proof_core_bridge.py::test_runtime_integrity_drift_blocks_compile             tests/test_proof_core_bridge.py::test_success_without_reviewed_object_is_rejected             tests/test_intrinsic_mode_bridge.py::test_r9_lean_command_uses_fixed_content_pinned_binary             tests/test_intrinsic_mode_bridge.py::test_r9_lean_command_rejects_unreviewed_compiler_content             tests/test_intrinsic_mode_bridge.py::test_r9_toolchain_identity_is_content_bound_not_filesystem_metadata             tests/test_intrinsic_mode_bridge.py::test_r9_runtime_integrity_drift_blocks_compile             tests/test_intrinsic_mode_bridge.py::test_r9_success_without_reviewed_object_is_rejected

      - name: Install exact pinned Lean runtime
        env:
          LEAN_ARCHIVE_SHA256: 5b51625f154f0a13b37bd892f1d95f79e9fd5b9f0d095b4126215ee2bc8dbe86
          LEAN_ARCHIVE_URL: https://github.com/leanprover/lean4/releases/download/v4.30.0-rc2/lean-4.30.0-rc2-linux.tar.zst
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error -o "$archive" "$LEAN_ARCHIVE_URL"
          printf '%s  %s\n' "$LEAN_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          unpack="$RUNNER_TEMP/lean-unpack"
          mkdir -p "$unpack" "$HOME/.elan/toolchains"
          tar --zstd -xf "$archive" -C "$unpack"
          mv "$unpack/lean-4.30.0-rc2-linux" "$HOME/.elan/toolchains/leanprover--lean4---v4.30.0-rc2"
          lean="$HOME/.elan/toolchains/leanprover--lean4---v4.30.0-rc2/bin/lean"
          test "$(sha256sum "$lean" | cut -d' ' -f1)" = "3e0d0d3d801675359f2d4cf9815bfdb417b20b92fdd9d48b3b14c95bbae28bbf"
          "$lean" --version

      - name: Real R7 guarded replay
        run: |
          set -euo pipefail
          python - <<'PY'
          from src.core.proof_core_bridge import check_proof_core_bridge
          report = check_proof_core_bridge()
          print("REAL_R7_STATUS", report.status)
          print("REAL_R7_LEAN_CHECKED", report.lean_checked)
          print("REAL_R7_TOOLCHAIN", report.toolchain)
          print("REAL_R7_DIAGNOSTICS", report.diagnostics)
          assert report.status == "checked", report.diagnostics
          assert report.lean_checked is True
          assert "merkle=990d68abe5bda161659d2a28ad9ba70f8739fdc30fb3655e3258df6bbc2f761a" in report.toolchain
          PY

      - name: Reverse check-to-exec swap falsification
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from unittest.mock import patch

          import src.core.proof_core_bridge as bridge

          lean = bridge.LEAN_BINARY
          original = lean.read_bytes()
          mode = lean.stat().st_mode
          marker = Path("/tmp/r7-malicious-executed")
          malicious = (
              "#!/usr/bin/env bash\n"
              "printf executed > /tmp/r7-malicious-executed\n"
              "exit 0\n"
          ).encode()

          original_materialize = bridge.materialize_lean_snapshot
          swapped = False

          def materialize_then_swap(*args, **kwargs):
              global swapped
              snapshot = original_materialize(*args, **kwargs)
              lean.write_bytes(malicious)
              lean.chmod(mode)
              swapped = True
              return snapshot

          try:
              with patch.object(
                  bridge,
                  "materialize_lean_snapshot",
                  side_effect=materialize_then_swap,
              ):
                  report = bridge.check_proof_core_bridge()
          finally:
              lean.write_bytes(original)
              lean.chmod(mode)

          print("SWAP_REVERSED_STATUS", report.status)
          print("SWAP_REVERSED_LEAN_CHECKED", report.lean_checked)
          print("SWAP_REVERSED_DIAGNOSTICS", report.diagnostics)
          print("SWAP_REVERSED_MALICIOUS_EXECUTED", marker.exists())
          assert swapped
          assert report.status == "blocked"
          assert report.lean_checked is False
          assert "runtime" in report.diagnostics
          assert not marker.exists()
          PY

      - name: Attest exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "RUNTIME_CONTINUITY_FOCUSED_PASS target=$TARGET_SHA clean=yes"
