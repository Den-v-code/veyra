name: exact-proof-fix-pytest-hang

on:
  push:
    branches:
      - verify/current-tree-proof-fix-pytest-hang-v1

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Den-v-code/veyra
          ref: 344f68a9457d906c2ac559138363bd4797f509bf
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"
      - name: Install exact Python tools
        run: |
          python -m pip install --no-deps --requirement requirements/ci-py311.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run timeout controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python - <<'PY'
          import subprocess, time
          nodes=[
            "tests/test_core_vam_semantic_parity.py::test_every_native_core_kind_has_the_same_vam_observer_response[length-mode(breath(tact(nod:a,nod:b),tact(nod:b,nod:a)))]",
            "tests/test_core_vam_semantic_parity.py::test_every_native_core_kind_has_the_same_vam_observer_response[length-observer:kind]",
            "tests/test_core_vam_semantic_parity.py::test_every_native_core_kind_has_the_same_vam_observer_response[trace-rez:a]",
          ]
          for node in nodes:
              started=time.monotonic()
              try:
                  p=subprocess.run(
                      ["python","-m","pytest","-q","-p","no:cacheprovider",node],
                      text=True,capture_output=True,timeout=120,check=False,
                  )
                  elapsed=time.monotonic()-started
                  print(f"CASE elapsed={elapsed:.3f}s rc={p.returncode} node={node}")
                  print(p.stdout[-4000:])
                  print(p.stderr[-4000:])
                  if p.returncode:
                      raise SystemExit(p.returncode)
              except subprocess.TimeoutExpired:
                  elapsed=time.monotonic()-started
                  print(f"TIMEOUT elapsed={elapsed:.3f}s node={node}")
                  raise
          PY
