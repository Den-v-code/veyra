name: exact-readiness-r13-internal-timing

on:
  push:
    branches:
      - verify/readiness-r13-internal-timing-v1

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TARGET_SHA: 147650a64654cc6b6b1d7f5de91036f0c53eb109
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Den-v-code/veyra
          ref: 147650a64654cc6b6b1d7f5de91036f0c53eb109
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"

      - name: Install exact Python tools
        run: |
          set -euo pipefail
          python -m pip install --no-deps --requirement requirements/ci-py311.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Install exact elan and Lean
        env:
          ELAN_ARCHIVE_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
          LEAN_ARCHIVE_SHA256: 5b51625f154f0a13b37bd892f1d95f79e9fd5b9f0d095b4126215ee2bc8dbe86
          LEAN_ARCHIVE_URL: https://github.com/leanprover/lean4/releases/download/v4.30.0-rc2/lean-4.30.0-rc2-linux.tar.zst
        run: |
          set -euo pipefail
          ea="$RUNNER_TEMP/elan.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error -o "$ea" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$ea" | sha256sum --check --strict
          eu="$RUNNER_TEMP/elan-unpack"
          mkdir -p "$eu" "$HOME/.elan/bin" "$HOME/.elan/toolchains"
          tar -xzf "$ea" -C "$eu"
          install -m 0755 "$(find "$eu" -type f -name elan-init -print -quit)" "$HOME/.elan/bin/elan"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

          la="$RUNNER_TEMP/lean.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error -o "$la" "$LEAN_ARCHIVE_URL"
          printf '%s  %s\n' "$LEAN_ARCHIVE_SHA256" "$la" | sha256sum --check --strict
          lu="$RUNNER_TEMP/lean-unpack"
          mkdir -p "$lu"
          tar --zstd -xf "$la" -C "$lu"
          mv "$lu/lean-4.30.0-rc2-linux" "$HOME/.elan/toolchains/leanprover--lean4---v4.30.0-rc2"
          echo "$HOME/.elan/toolchains/leanprover--lean4---v4.30.0-rc2/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.30.0-rc2 lean --version | grep -F 'Lean (version 4.30.0-rc2'

      - name: Instrument R12 and R13 public report calls
        run: |
          set -euo pipefail
          python - <<'PY'
          from time import monotonic
          import src.core.intrinsic_vam_formal_bridge as r12
          import src.core.intrinsic_vam_formal_bridge_core as r12core
          import src.core.intrinsic_observer_echo_formal_bridge as r13
          import src.core.intrinsic_observer_echo_formal_bridge_core as r13core

          events=[]

          def wrap(module, name, label):
              original=getattr(module,name)
              def timed(*args, **kwargs):
                  started=monotonic()
                  print(f"CALL_START {label}", flush=True)
                  try:
                      return original(*args, **kwargs)
                  finally:
                      elapsed=monotonic()-started
                      events.append((label, elapsed))
                      print(f"CALL_END {label} elapsed={elapsed:.3f}s", flush=True)
              setattr(module,name,timed)

          # Core check() uses the compile function imported into bridge_core.
          wrap(r12core, "compile_snapshot", "R12_CORE_COMPILE")
          # Public verifier uses its own imported compile_snapshot.
          wrap(r12, "compile_snapshot", "R12_VERIFY_COMPILE")
          wrap(r13core, "compile_snapshot", "R13_CORE_COMPILE")
          wrap(r13, "compile_snapshot", "R13_VERIFY_COMPILE")

          r12._cached_default_report.cache_clear()
          r13._cached_default_report.cache_clear()

          for label, fn in (
              ("R12_PUBLIC_FIRST", r12.intrinsic_vam_formal_bridge_report),
              ("R12_PUBLIC_SECOND", r12.intrinsic_vam_formal_bridge_report),
              ("R13_PUBLIC_FIRST", r13.intrinsic_observer_echo_formal_bridge_report),
              ("R13_PUBLIC_SECOND", r13.intrinsic_observer_echo_formal_bridge_report),
          ):
              started=monotonic()
              print(f"API_START {label}", flush=True)
              report=fn()
              elapsed=monotonic()-started
              print(
                  f"API_END {label} elapsed={elapsed:.3f}s "
                  f"status={report.status} binding={report.binding_digest}",
                  flush=True,
              )

          print("EVENT_SUMMARY", flush=True)
          for label, elapsed in events:
              print(f"EVENT {label} elapsed={elapsed:.3f}s", flush=True)
          PY

      - name: Attest unchanged target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
