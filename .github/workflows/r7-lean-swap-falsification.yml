name: r7-lean-swap-falsification

on:
  push:
    branches:
      - verify/current-tree-proof-execution-binding-v2-canonical

permissions:
  contents: read

jobs:
  falsify:
    name: Falsify R7 check-to-exec Lean binding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Den-v-code/veyra
          ref: a11fee75f9e4f803ce72b807f484eae407e8523f
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.14"

      - name: Install exact Lean archive
        env:
          LEAN_ARCHIVE_SHA256: 5b51625f154f0a13b37bd892f1d95f79e9fd5b9f0d095b4126215ee2bc8dbe86
          LEAN_ARCHIVE_URL: https://github.com/leanprover/lean4/releases/download/v4.30.0-rc2/lean-4.30.0-rc2-linux.tar.zst
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean.tar.zst"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error -o "$archive" "$LEAN_ARCHIVE_URL"
          printf '%s  %s\n' "$LEAN_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          root="$RUNNER_TEMP/lean-unpack"
          mkdir -p "$root"
          tar --zstd -xf "$archive" -C "$root"
          lean="$root/lean-4.30.0-rc2-linux/bin/lean"
          test "$(sha256sum "$lean" | cut -d' ' -f1)" = "3e0d0d3d801675359f2d4cf9815bfdb417b20b92fdd9d48b3b14c95bbae28bbf"
          printf 'REAL_LEAN=%s\n' "$lean" >> "$GITHUB_ENV"

      - name: Demonstrate check-to-exec pathname swap
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch

          import src.core.proof_core_bridge as bridge

          with TemporaryDirectory(prefix="r7-swap-") as td:
              root = Path(td)
              alias = root / "lean"
              alias.symlink_to(Path(os.environ["REAL_LEAN"]))

              fake_elan = root / "elan"
              fake_elan.write_text(
                  "#!/usr/bin/env bash\n"
                  "set -euo pipefail\n"
                  "if [[ \"$#\" -eq 2 && \"$1\" == which && \"$2\" == lean ]]; then\n"
                  f"  printf '%s\\n' '{alias}'\n"
                  "  exit 0\n"
                  "fi\n"
                  "exit 97\n"
              )
              fake_elan.chmod(0o700)

              malicious = root / "malicious-lean"
              malicious.write_text("#!/usr/bin/env bash\nexit 0\n")
              malicious.chmod(0o700)

              original_materialize = bridge.materialize_lean_snapshot
              swapped = False

              def materialize_then_swap(*args, **kwargs):
                  nonlocal_swapped = original_materialize(*args, **kwargs)
                  alias.unlink()
                  alias.symlink_to(malicious)
                  return nonlocal_swapped

              with (
                  patch.object(bridge.shutil, "which", return_value=str(fake_elan)),
                  patch.object(bridge, "materialize_lean_snapshot", side_effect=materialize_then_swap),
              ):
                  report = bridge.check_proof_core_bridge()

              print("SWAP_STATUS", report.status)
              print("SWAP_LEAN_CHECKED", report.lean_checked)
              print("SWAP_DIAGNOSTICS", report.diagnostics)
              print("SWAP_ALIAS_TARGET", alias.resolve())
              assert alias.resolve() == malicious
              assert report.status == "checked"
              assert report.lean_checked is True
          PY

      - name: Attest target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a11fee75f9e4f803ce72b807f484eae407e8523f"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FALSIFICATION_TARGET a11fee75f9e4f803ce72b807f484eae407e8523f"
