name: repair-pr98-post99-workbench

on:
  push:
    branches:
      - verify/pr98-post99-rebase-workbench-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verify/pr98-post99-rebase-workbench-v1
          persist-credentials: true
      - name: Repair falsification fixture path once
        run: |
          set -euo pipefail
          target=.github/workflows/pr98-post99-rebase-workbench.yml
          if ! grep -q '/attacker/elan' "$target"; then
            echo 'fixture already repaired'
            exit 0
          fi
          sed -i 's#/attacker/elan#/usr/bin/true#' "$target"
          git diff --check
          git config user.name 'Den-v-code'
          git config user.email 'contributors@veyra.invalid'
          git add "$target"
          git commit -m 'ci: repair post-99 falsification fixture'
          git push origin HEAD:refs/heads/verify/pr98-post99-rebase-workbench-v1
